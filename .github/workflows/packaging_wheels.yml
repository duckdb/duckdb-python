name: Wheels packaging
# Four jobs; the three that build share the steps in .github/actions/build-wheel,
# the fourth only installs and tests what the seeds built:
#
# - seed_wheels builds the stable ABI wheel (cp312, which serves CPython 3.12
#   and up) on every platform, once, and runs no tests: the wheel is tested by
#   test_abi3_wheels on every interpreter it serves, cp312 included. The seeds
#   are the only cache writers, and only when the caller asks for it, which
#   cache_warm does on a push to a protected branch; a release run builds at
#   the engine commit it was given and must not overwrite the pin's cache. The
#   cross python hit rate is high because most translation units are DuckDB
#   core, which is python independent.
# - sanity_wheels builds the oldest python on Linux only, as a cheap boundary
#   check in minimal mode (PRs and the merge queue). It runs parallel to the
#   seeds: those runs never save caches, so ordering buys nothing there. Its
#   wheel serves exactly the python that built it, so cibuildwheel's inline
#   test is the right place for its suite.
# - build_wheels fans out the remaining pythons on every platform against the
#   cache the seeds wrote. Full runs only. Skipping it in minimal mode is a
#   job condition on purpose: matrix excludes cannot express zero jobs, and a
#   matrix that excludes every combination fails the whole run at strategy
#   evaluation time.
# - test_abi3_wheels installs the cp312 wheel into every interpreter it serves
#   and runs the test suite there. Linux tests every interpreter in every mode.
#   Windows and macOS test every interpreter in full runs and the oldest and
#   newest in minimal mode. The universal2 wheel is left out, as in
#   CIBW_TEST_SKIP: its slices are the arm64 and x86_64 wheels, tested as those.
#
# The python lists below differ per release branch and are kept line isolated
# so merges between branches resolve mechanically. Everything else in this
# file must stay identical across the branches that ship the abi3 wheel. The
# branches that still build one wheel per python (main, v1.5-variegata) keep
# their own copy until they switch.
on:
  workflow_call:
    inputs:
      minimal:
        type: boolean
        description: Build a minimal set of wheels to do a sanity check
        default: false
      build-sanity:
        type: boolean
        description: In minimal mode, also build the oldest python on Linux. Cache warming turns it off.
        default: true
      save-cache:
        type: boolean
        description: >-
          Let the seed jobs save their ccaches. Only cache warming turns it on: a release run may build
          against an engine commit other than the pin, and its cache would make every PR recompile.
        default: false
      testsuite:
        type: string
        description: Testsuite to run (none, fast, all)
        required: true
        default: all
      duckdb-python-sha:
        type: string
        description: The commit or ref to build against (defaults to latest commit of current ref)
        required: false
      duckdb-sha:
        type: string
        description: Override the DuckDB submodule commit or ref to build against
        required: false
      set-version:
        description: Force the package version (vX.Y.Z, optionally -postN or a PEP440 pre-release suffix like -a1/-alpha1/-b2/-rc3)
        required: false
        type: string
      set-duckdb-version:
        description: Force the version DuckDB is built with. Handed to DuckDB's build verbatim, which validates it.
        required: false
        type: string

jobs:
  seed_wheels:
    name: 'Seed: ${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}'
    strategy:
      fail-fast: false
      matrix:
        python: [ cp312 ]
        platform:
          - { os: windows-2022,     arch: amd64,      cibw_system: win }
          - { os: windows-11-arm,   arch: ARM64,      cibw_system: win } # cibw requires ARM64 to be uppercase
          - { os: ubuntu-24.04,     arch: x86_64,     cibw_system: manylinux }
          - { os: ubuntu-24.04-arm, arch: aarch64,    cibw_system: manylinux }
          - { os: macos-15,         arch: arm64,      cibw_system: macosx }
          - { os: macos-15,         arch: universal2, cibw_system: macosx }
          - { os: macos-15-intel,   arch: x86_64,     cibw_system: macosx }
        # Single value dimension, only here so the exclude below can key on it.
        # Safe in this job: the exclude can never empty the matrix.
        minimal:
          - ${{ inputs.minimal }}
        exclude:
          - { minimal: true, platform: { arch: universal2 } }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout DuckDB Python
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.duckdb-python-sha }}
          fetch-depth: 0
          submodules: true

      - name: Build the wheel
        uses: ./.github/actions/build-wheel
        with:
          python: ${{ matrix.python }}
          arch: ${{ matrix.platform.arch }}
          cibw-system: ${{ matrix.platform.cibw_system }}
          # The abi3 wheel is tested by test_abi3_wheels on every interpreter it serves.
          testsuite: none
          duckdb-sha: ${{ inputs.duckdb-sha }}
          set-version: ${{ inputs.set-version }}
          set-duckdb-version: ${{ inputs.set-duckdb-version }}
          ccache-save: ${{ inputs.save-cache && 'true' || 'false' }}

  sanity_wheels:
    name: 'Sanity: ${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}'
    if: ${{ inputs.minimal && inputs.build-sanity }}
    strategy:
      fail-fast: false
      matrix:
        python: [ cp311 ]
        platform:
          - { os: ubuntu-24.04,     arch: x86_64,     cibw_system: manylinux }
          - { os: ubuntu-24.04-arm, arch: aarch64,    cibw_system: manylinux }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout DuckDB Python
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.duckdb-python-sha }}
          fetch-depth: 0
          submodules: true

      - name: Build the wheel
        uses: ./.github/actions/build-wheel
        with:
          python: ${{ matrix.python }}
          arch: ${{ matrix.platform.arch }}
          cibw-system: ${{ matrix.platform.cibw_system }}
          testsuite: ${{ inputs.testsuite }}
          duckdb-sha: ${{ inputs.duckdb-sha }}
          set-version: ${{ inputs.set-version }}
          set-duckdb-version: ${{ inputs.set-duckdb-version }}
          ccache-save: 'false'

  build_wheels:
    name: 'Wheel: ${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}'
    if: ${{ !inputs.minimal }}
    needs: seed_wheels
    strategy:
      fail-fast: false
      matrix:
        python: [ cp311 ]
        platform:
          - { os: windows-2022,     arch: amd64,      cibw_system: win }
          - { os: windows-11-arm,   arch: ARM64,      cibw_system: win } # cibw requires ARM64 to be uppercase
          - { os: ubuntu-24.04,     arch: x86_64,     cibw_system: manylinux }
          - { os: ubuntu-24.04-arm, arch: aarch64,    cibw_system: manylinux }
          - { os: macos-15,         arch: arm64,      cibw_system: macosx }
          - { os: macos-15,         arch: universal2, cibw_system: macosx }
          - { os: macos-15-intel,   arch: x86_64,     cibw_system: macosx }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout DuckDB Python
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.duckdb-python-sha }}
          fetch-depth: 0
          submodules: true

      - name: Build the wheel
        uses: ./.github/actions/build-wheel
        with:
          python: ${{ matrix.python }}
          arch: ${{ matrix.platform.arch }}
          cibw-system: ${{ matrix.platform.cibw_system }}
          testsuite: ${{ inputs.testsuite }}
          duckdb-sha: ${{ inputs.duckdb-sha }}
          set-version: ${{ inputs.set-version }}
          set-duckdb-version: ${{ inputs.set-duckdb-version }}
          ccache-save: 'false'

  test_abi3_wheels:
    name: 'Test abi3: py${{ matrix.python }}-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}'
    # Not skipped when one seed leg failed: the other platforms' wheels exist and deserve their result.
    if: ${{ !cancelled() && inputs.testsuite != 'none' }}
    needs: seed_wheels
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.12', '3.13', '3.14', '3.15' ]
        platform:
          - { os: windows-2022,     arch: amd64,      cibw_system: win }
          - { os: windows-11-arm,   arch: ARM64,      cibw_system: win }
          - { os: ubuntu-24.04,     arch: x86_64,     cibw_system: manylinux }
          - { os: ubuntu-24.04-arm, arch: aarch64,    cibw_system: manylinux }
          - { os: macos-15,         arch: arm64,      cibw_system: macosx }
          - { os: macos-15-intel,   arch: x86_64,     cibw_system: macosx }
        # Single value dimension so the excludes can key on it. In minimal mode Windows and macOS test only the
        # oldest and newest interpreter; the excluded middle versions are line isolated like the python list above.
        # The excludes can never empty the matrix: Linux and the two boundary versions always remain.
        minimal:
          - ${{ inputs.minimal }}
        exclude:
          - { minimal: true, python: '3.13', platform: { cibw_system: win } }
          - { minimal: true, python: '3.13', platform: { cibw_system: macosx } }
          - { minimal: true, python: '3.14', platform: { cibw_system: win } }
          - { minimal: true, python: '3.14', platform: { cibw_system: macosx } }
    runs-on: ${{ matrix.platform.os }}
    steps:
      # The test dependency export reads the project's version, which the build backend takes from the DuckDB
      # submodule and the git history.
      - name: Checkout DuckDB Python
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.duckdb-python-sha }}
          fetch-depth: 0
          submodules: true

      - name: Fetch the wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-cp312-${{ matrix.platform.cibw_system }}_${{ matrix.platform.arch }}
          path: wheelhouse

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          enable-cache: false

      # The tests run from a copy, like cibuildwheel's, so that the checkout's own duckdb package directory is not
      # what `import duckdb` finds. The copy lives in the interpreter's temp directory, also like cibuildwheel's:
      # on Windows the checkout is on D: and the temp directory on C:, and test_arrow_fs_wrapper builds a
      # local://C:/... URL whose drive letter fsspec takes for a host, so pyarrow resolves the rest against the
      # current drive and only finds the file when the test runs from C:.
      - name: Install the wheel with the test dependencies and run the suite
        shell: bash
        run: |
          set -eo pipefail
          uv venv --python "${{ matrix.python }}" .venv-wheel
          uv export --only-group test --no-emit-project --quiet --output-file pylock.toml
          uv pip install --python .venv-wheel -r pylock.toml
          uv pip install --python .venv-wheel wheelhouse/*.whl
          venv="$PWD/.venv-wheel"
          testrun=$(uv run --no-project --python "$venv" python -c 'import tempfile; print(tempfile.mkdtemp(prefix="duckdb-testrun-"))')
          cp -r tests pyproject.toml "$testrun"
          cd "$testrun"
          uv run --no-project --python "$venv" python -c "import duckdb, sys, os; print(duckdb.__version__, sys.version, os.getcwd())"
          uv run --no-project --python "$venv" pytest --confcutdir=. --rootdir . -c pyproject.toml ${{ inputs.testsuite == 'fast' && './tests/fast' || './tests' }}
