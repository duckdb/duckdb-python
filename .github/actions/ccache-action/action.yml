name: 'Setup Ccache'
description: 'Restore the ccache for a key and save it at job end on a protected branch of this repository, or on any ref of a fork.'
inputs:
  key:
    description: 'Cache key (defaults to github.job)'
    required: false
    default: ''
  save:
    description: 'Allow saving the cache at job end. Saving also requires a cache writing ref, see below.'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
     - name: Setup Ccache
       uses: hendrikmuhs/ccache-action@main
       with:
         key: ${{ inputs.key || github.job }}
         # Only protected branches write, which in this repository are main and the release branches. Pull
         # requests restore from their base branch, pushes and merge queue entries from the default branch;
         # none of them saves. The merge queue is excluded by name as well, because ref_protected is not
         # documented for its temporary branches. Forks save on every ref.
         save: ${{ inputs.save == 'true' && (github.repository != 'duckdb/duckdb-python' || (github.ref_protected && github.event_name != 'merge_group')) }}
         # Dump verbose ccache statistics report at end of CI job.
         verbose: 1
         # Increase per-directory limit: 5*1024 MB / 16 = 320 MB.
         # Note: `layout=subdirs` computes the size limit divided by 16 dirs.
         # See also: https://ccache.dev/manual/4.9.html#_cache_size_management
         max-size: 1500MB
         # Evicts all cache files that were not touched during the job run.
         # Removing cache files from previous runs avoids creating huge caches.
         evict-old-files: 'job'
